<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Stories — 2026-09-22</title>
<style>
:root {
  --bg:#05070a;
  --panel:#101521;
  --card:#141b2a;
  --text:#f5f5f5;
  --muted:#a0aec0;
  --border:#263145;
  --accent:#4fd1c5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 22px 22px;
  font-family: system-ui, -apple-system, Segoe UI, sans-serif;
  background: var(--bg); color: var(--text);
}
.meta { color: var(--muted); font-size: 0.85rem; }
.story-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 14px;
  margin-bottom: 12px;
}
.story-head {
  display: flex; gap: 14px; justify-content: space-between; align-items: flex-start;
}
.story-title {
  font-size: 1.02rem;
  font-weight: 600;
  line-height: 1.25;
}
.story-badges {
  display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;
}
.badge {
  border: 1px solid var(--border);
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 0.78rem;
}
.badge.muted { color: var(--muted); }
.story-sub { margin-top: 8px; }
.story-details { margin-top: 10px; }
.story-details summary {
  cursor: pointer;
  color: var(--accent);
  font-size: 0.92rem;
}
ul.items { margin: 10px 0 0 0; padding-left: 18px; }
ul.items li { margin-bottom: 6px; line-height: 1.25; }
a { color: var(--text); }
a:hover { color: var(--accent); }
</style>
</head>
<body>
<div id="stories">

</div>

<script>
// filtri arrivano dal wrapper via querystring: ?country=...&q=...
const params = new URLSearchParams(window.location.search);
const country = params.get('country') || 'all';
const q = (params.get('q') || '').toLowerCase().trim();

const cards = Array.from(document.querySelectorAll('.story-card'));

cards.forEach(card => {
  const okCountry = (country === 'all') || (card.getAttribute('data-country') === country);
  const hay = (card.getAttribute('data-search') || '').toLowerCase();
  const okSearch = !q || hay.includes(q);
  card.style.display = (okCountry && okSearch) ? 'block' : 'none';
});
</script>
</body>
</html>
